name: Warcrafting Android release

on:
  push:
    branches: [ main, ccr-5207e624-bpk963 ]
    paths:
      - 'acgc/**'
      - 'mod/**'
      - 'tools/make_android_pack.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warcrafting-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python tools
        run: pip install pillow

      - name: Android SDK packages (preinstalled SDK on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build mod assets (uncompressed RGBA texture pack for Android)
        run: python tools/make_android_pack.py . acgc/app/src/main/assets

      - name: Optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: acgc
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            {
              echo "storeBase64=$KEYSTORE_BASE64"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Signing with the provided release keystore"
          else
            echo "No keystore secrets set: the release APK is signed with the debug key"
          fi

      - name: Build release APK
        working-directory: acgc
        env:
          WARCRAFTING_VERSION_CODE: ${{ github.run_number }}
          WARCRAFTING_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          APK=$(ls acgc/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" "dist/Warcrafting-1.0.${{ github.run_number }}.apk"
          # Mod zips for the PC port or manual use: texture_pack/ next to the executable
          for town in alliance horde; do
            rm -rf stage && mkdir -p stage/texture_pack
            cp acgc/app/src/main/assets/mod/$town/*.dds stage/texture_pack/
            cp acgc/app/src/main/assets/mod/common/*.dds stage/texture_pack/
            (cd stage && zip -qr "../dist/Warcrafting-mod-$town.zip" texture_pack)
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: warcrafting-release
          path: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="warcrafting-build-${{ github.run_number }}"
          gh release create "$TAG" dist/* \
            --target "${{ github.sha }}" \
            --title "Warcrafting 1.0.${{ github.run_number }}" \
            --notes "Animal Crossing (GameCube, USA) port with the Warcraft III mod: custom title logo and Alliance/Horde ground textures. Import your own GAFE01 disc image in the app. The APK bundles the texture pack; the mod zips are for the PC port."
